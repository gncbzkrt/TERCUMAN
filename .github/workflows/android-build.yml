name: TERCUMAN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 35 kur
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.TERCUMAN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tercuman-release.jks"
          chmod 600 "$RUNNER_TEMP/tercuman-release.jks"

      - name: APK oluştur
        env:
          TERCUMAN_KEYSTORE_PATH: ${{ runner.temp }}/tercuman-release.jks
          TERCUMAN_KEYSTORE_PASSWORD: ${{ secrets.TERCUMAN_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yı hazırla
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TERCUMAN-v1.4.1-debug.apk

      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TERCUMAN-v1.4.1-APK
          path: out/TERCUMAN-v1.4.1-debug.apk
